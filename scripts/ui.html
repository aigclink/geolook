<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeoLook · 生成式引擎优化平台</title>
<style>
/* Nocturne 设计系统令牌（取自设计稿 styles.css，暗色单主题） */
:root{
  --bg:#161826; --surface:#232532; --side:#1b1d2b; --deep:#1b1d2b;
  --text:#e9e9ed; --t400:#b2b6ca; --t500:#9397ab; --t600:#75798c; --t700:#595d6c;
  --accent:#9184d9; --a100:#f5f4ff; --a300:#d2cefd; --a400:#b5abfc;
  --a700:#5d5294; --a800:#423a6a; --a900:#2b2741;
  --n800:#3f424d; --n900:#292b31;
  --divider:rgba(233,233,237,0.16); --line:rgba(233,233,237,0.08);
  --r-md:8px; --r-lg:14px;
  --sh-sm:0 0 0 1px #3f424d; --sh-md:0 0 0 1px #595d6c,0 6px 18px rgba(0,0,0,.55);
  --font:"Inter",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 var(--font)}
h1,h2,h3,h4{font-weight:500;line-height:1.12;letter-spacing:-.015em;margin:0 0 6px}
h2{font-size:32px} h3{font-size:25px} h4{font-size:20px}
p{margin:0 0 8px}
a{color:var(--accent);text-underline-offset:3px}
::selection{background:rgba(145,132,217,.3)}
:focus{outline:none} :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#3f424d;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  font:500 14px/1.2 var(--font);color:var(--text);background:transparent;
  border:1px solid transparent;padding:7px 12px;border-radius:var(--r-md);text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{color:var(--accent);border-color:var(--accent)}
.btn-primary:hover{background:rgba(145,132,217,.12)}
.btn-secondary{border-color:var(--divider)}
.btn-secondary:hover{background:rgba(233,233,237,.07)}
.btn-ghost{color:var(--accent);padding-inline:4px}
.btn-ghost:hover{background:rgba(145,132,217,.10)}
.btn-block{width:100%}
.card{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:var(--r-md);background:var(--surface)}
.elev{box-shadow:var(--sh-sm)}
.kicker{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;padding:3px 10px;border-radius:6px;white-space:nowrap}
.tag-accent{background:var(--a800);color:var(--a100)}
.tag-neutral{background:var(--n800);color:#f3f5fe}
.tag-dim{background:var(--n900);color:var(--t500)}
.tag-outline{border:1px solid var(--accent);color:var(--accent);background:transparent}
.pill-good{background:var(--a900);color:var(--a300)}
.pill-warn{background:var(--n800);color:#e4e7f5}
.tbl{overflow-x:auto}
.tbl .table{min-width:820px}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--t600);padding:6px 8px;white-space:nowrap}
.table td{padding:8px;vertical-align:top}
.table thead tr{background:linear-gradient(to right,transparent,var(--divider) 48px,var(--divider) calc(100% - 48px),transparent) no-repeat bottom/100% 1px}
.table tbody tr{background:linear-gradient(to right,transparent,var(--line) 48px,var(--line) calc(100% - 48px),transparent) no-repeat bottom/100% 1px}
.table tbody tr:hover{background:
  linear-gradient(rgba(233,233,237,.04),rgba(233,233,237,.04)) no-repeat 0 0/100% 100%,
  linear-gradient(to right,transparent,var(--line) 48px,var(--line) calc(100% - 48px),transparent) no-repeat bottom/100% 1px}
.field>label{display:block;font-size:12px;margin-bottom:5px;color:rgba(233,233,237,.7)}
.input{width:100%;min-height:36px;padding:6px 10px;font:inherit;font-size:14px;color:var(--text);
  caret-color:var(--accent);background:var(--surface);border:1px solid var(--divider);border-radius:var(--r-md)}
.input:hover{border-color:rgba(233,233,237,.45)}
.input:focus-visible{border-color:var(--accent);outline-offset:0}
textarea.input{min-height:90px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.7}
.seg{display:inline-flex;overflow:hidden;border:1px solid var(--divider);border-radius:var(--r-md)}
.seg-opt{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:13px;cursor:pointer}
.seg-opt+.seg-opt{border-left:1px solid var(--divider)}
.seg-opt input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.seg-opt:has(input:checked){color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seg-opt:not(:has(input:checked)):hover{background:rgba(233,233,237,.07)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.muted{color:var(--t600)} .soft{color:var(--t400)}
pre.log{background:var(--deep);border-radius:var(--r-md);box-shadow:var(--sh-sm);padding:13px 15px;
  font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:400px;overflow:auto;
  white-space:pre-wrap;margin:0;color:var(--t400)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--accent);border-right-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;right:20px;bottom:20px;background:var(--surface);box-shadow:var(--sh-md);
  border-left:3px solid var(--accent);border-radius:var(--r-md);padding:11px 16px;z-index:90;
  font-size:13px;max-width:400px;animation:sl .2s ease-out}
@keyframes sl{from{transform:translateY(8px);opacity:0}}
.toast.err{border-left-color:#d55}
.modal{position:fixed;inset:0;background:rgba(41,43,49,.6);display:grid;place-items:center;z-index:60;padding:24px}
.modal .box{background:var(--surface);border-radius:var(--r-lg);padding:22px 24px;max-width:620px;width:100%;
  box-shadow:var(--sh-md);max-height:88vh;overflow:auto}
.bar{height:7px;border-radius:4px;background:var(--deep);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#5d5294,#9184d9)}
.uln{box-shadow:inset 0 -2px 0 var(--accent);padding-bottom:1px}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.spec{display:grid;grid-template-columns:repeat(4,auto);gap:26px;justify-content:start}
.spec .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t600)}
.spec .v{font-size:12.5px;margin-top:2px}

#side{width:236px;flex:none;display:flex;flex-direction:column;gap:18px;padding:18px 12px 20px;
  background:var(--side);box-shadow:inset -1px 0 0 rgba(233,233,237,.10);
  position:sticky;top:0;height:100vh;overflow:auto}
.navgrp{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t600);padding:0 8px 4px}
.navit{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;cursor:pointer;
  font:inherit;font-size:13px;padding:7px 8px;border-radius:6px;background:transparent;color:var(--t400)}
.navit:hover{background:rgba(233,233,237,.05)}
.navit.on{background:var(--a900);color:var(--text)}
.navit .mark{width:2px;height:14px;border-radius:2px;flex:none;background:transparent}
.navit.on .mark{background:var(--accent)}
.navit .bdg{margin-left:auto;font-size:10.5px;color:var(--t600)}

/* KPI 栅格与工作台三栏用 class 而非内联样式，方便窄屏媒体查询覆盖 */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:20px}
.wb3{display:grid;grid-template-columns:262px minmax(360px,1fr) 300px;gap:14px;align-items:start;overflow-x:auto}
#burger{display:none;position:fixed;top:10px;left:10px;z-index:70}
@media (max-width:1100px){
  .wb3{grid-template-columns:1fr;overflow-x:visible}
}
@media (max-width:900px){
  #burger{display:inline-flex}
  #side{position:fixed;left:-260px;transition:left .2s;z-index:50}
  #side.open{left:0}
  #main{margin-left:0;padding-top:52px}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<button id="burger" class="btn btn-secondary" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
<div style="display:flex;align-items:stretch;min-height:100vh">
  <aside id="side"></aside>
  <main id="main" style="flex:1;min-width:0"><div id="view"></div></main>
</div>
<div id="modal"></div><div id="toast"></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=v=>v==null?'—':(v*100).toFixed(v>0&&v<0.095?1:0)+'%';
const api=async(u,o)=>{try{const r=await fetch(u,o);if(!r.ok)return{error:`HTTP ${r.status}`};return await r.json().catch(()=>({error:'响应不是 JSON'}))}catch(e){return{error:'连接失败：服务未响应'}}};
const mktLabel=m=>m==='cn'?'国内':m==='global'?'海外':'通用';
const diagTag=d=>{if(!d)return'<span style="font-size:12px;color:var(--t600)">—</span>';
  const cls=d.sev==='P0'?'tag-accent':d.sev==='P1'?'pill-warn':d.sev==='P2'?'tag-dim':'pill-good';
  return `<span class="tag ${cls}" title="${esc(d.detail)}" style="cursor:help">${esc(d.type)}</span>`};
function distRows(list,me){ // 品牌提及分布条：me=自己品牌名高亮
  const max=((list||[])[0]||{}).rate||1;
  return (list||[]).map(x=>{const mine=x.name===me;
    return `<div class="row" style="gap:8px;padding:4px 0">
      <span style="width:132px;flex:none;font-size:12.5px;${mine?'color:var(--a300)':''};overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(x.name)}">${esc(x.name)}${mine?' ⭑':''}</span>
      <div class="bar" style="flex:1;height:6px"><div style="height:100%;width:${Math.max(3,Math.round(x.rate/max*100))}%;background:${mine?'var(--a400)':'#595d6c'};border-radius:4px"></div></div>
      <span style="width:86px;flex:none;text-align:right;font-size:11.5px;color:var(--t400)">${pct(x.rate)} · ${x.hits} 次</span></div>`}).join('')
    ||'<div class="muted" style="font-size:12px">本期没有实体被提及</div>';
}
function progBar(p,f,w){ // 任务级 before/after：首测(f) → 当前(p) → 目标
  if(!p)return'';
  const fmt=v=>v==null?'—':(p.pct?pct(v):v),op=p.op==='lte'?'≤':'≥';
  let ratio; // 完成度：lte 型看从基线降到目标走了多远；gte 型看距目标比例
  if(p.op==='lte'){const b=(f&&f.cur!=null?f.cur:null)??p.base??Math.max(p.cur,p.target,1);
    ratio=b>p.target?(b-p.cur)/(b-p.target):(p.cur<=p.target?1:0)}
  else ratio=p.target?p.cur/p.target:0;
  ratio=Math.max(0,Math.min(1,ratio));
  return `<div style="margin-top:5px;max-width:280px">
    <div style="font-size:11px;color:var(--t500)">${esc(p.label)}：首测 ${fmt(f&&f.cur)} → 当前 <b style="color:var(--t300)">${fmt(p.cur)}</b> · 目标 ${op}${fmt(p.target)}</div>
    <div class="bar" style="margin-top:3px;height:5px"><div style="height:100%;width:${Math.round(ratio*100)}%;background:${ratio>=1?'var(--a400)':'var(--accent)'};border-radius:4px"></div></div></div>`}
const post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
let D=null,SLUG=null,R='overview',ACTIONS={},POLL=null,RUNNING=null,LASTJOB=null,LOGOFF=0;
let ST={gapTab:'content',engSel:null,wq:null,obStep:1,obSlug:null,obNoSample:false,obFail:false,obUrl:'',obName:'',obMkt:'both'};

function toast(m,k=''){const t=document.createElement('div');t.className='toast '+k;t.textContent=m;
  $('#toast').appendChild(t);setTimeout(()=>t.remove(),3800)}
function modal(h){$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box">${h}</div></div>`}
function closeModal(){$('#modal').innerHTML=''}
function go(r,extra,fromPop){R=r;Object.assign(ST,extra||{});
  // 接入浏览器历史：每次页面跳转压一条记录，后退/前进在应用内导航而不是退出应用
  if(!fromPop)history.pushState({r,engSel:ST.engSel,gapTab:ST.gapTab,wq:(extra||{}).wq||null},'','#'+r);
  render();scrollTo(0,0);$('#side').classList.remove('open')}
window.addEventListener('popstate',e=>{const s=e.state;if(!s||!s.r)return;
  if(s.engSel!==undefined)ST.engSel=s.engSel;
  if(s.gapTab)ST.gapTab=s.gapTab;
  if(s.r==='workbench'&&s.wq)ST.wq=s.wq;
  go(s.r,null,true)});
function head(kicker,title,sub){return `<div class="kicker">${esc(kicker)}</div>
  <h3 style="margin-bottom:6px">${title}</h3>
  ${sub?`<p class="soft" style="font-size:14px;max-width:700px;text-wrap:pretty">${sub}</p>`:''}`}

/* ===================== 界面多语言(zh/en/ja) =====================
   中文是源文案。en/ja 用「整句精确匹配 + 短节点词级替换」在渲染后翻译 DOM,
   字典未覆盖的保持中文(优雅降级);项目数据(问题库/工单/阵地文案)跟随数据语言,不翻。*/
const ULANG=(()=>{
  const q=new URLSearchParams(location.search).get('lang');
  if(['zh','en','ja'].indexOf(q)>=0){try{localStorage.setItem('ulang',q)}catch(e){}return q}
  const s=localStorage.getItem('ulang');if(['zh','en','ja'].indexOf(s)>=0)return s;
  const l=(navigator.language||'').toLowerCase();
  return l.indexOf('zh')===0?'zh':l.indexOf('ja')===0?'ja':'en'})();
function setLang(l){localStorage.setItem('ulang',l);location.reload()}

function uiTranslate(root){
  if(ULANG==='zh'||!root)return;
  const d=UI_D[ULANG],subs=UI_SUB[ULANG];
  if(root.nodeType===3){const t=root.nodeValue.trim();if(!t)return;
    if(d[t]!=null){root.nodeValue=root.nodeValue.replace(t,d[t]);return}
    for(const[rx,tpl]of UI_RX[ULANG])if(rx.test(t)){root.nodeValue=root.nodeValue.replace(t,t.replace(rx,tpl));return}
    if(t.length<=40){/* 词级替换仅当节点由已知词元+数字/标点组成——避免误伤数据文本 */
      let probe=t;for(const s of subs)probe=probe.split(s[0]).join('');
      if(!/[぀-ヿ一-鿿]/.test(probe)){
        let v=root.nodeValue;for(const s of subs)v=v.split(s[0]).join(s[1]);root.nodeValue=v}}
    return}
  if(root.nodeType!==1)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(uiTranslate);
  (root.querySelectorAll?root.querySelectorAll('[title],[placeholder]'):[]).forEach(el=>{
    ['title','placeholder'].forEach(a=>{const v=el.getAttribute(a);if(v&&d[v]!=null)el.setAttribute(a,d[v])})});
}
new MutationObserver(ms=>{if(ULANG==='zh')return;
  for(const m of ms)m.addedNodes.forEach(n=>uiTranslate(n))
}).observe(document.body,{childList:true,subtree:true});

async function runAction(a,params){
  const r=await post('/api/run',{slug:SLUG,action:a,params:params||{}});
  if(!r.ok){toast(r.error||'启动失败','err');return null}
  RUNNING=r.job.id;LASTJOB=r.job.id;LOGOFF=0;renderSide();pollJob();
  toast('已启动：'+((ACTIONS[a]||{}).label||a));return r.job;
}
async function pollJob(){
  clearTimeout(POLL); if(!RUNNING)return;
  const r=await api(`/api/job/${RUNNING}?offset=${LOGOFF}`);
  if(r.error){RUNNING=null;renderSide();toast('任务状态丢失','err');return}
  LOGOFF=r.offset;
  const pre=$('#joblog'); if(pre&&r.log){pre.textContent+=r.log;pre.scrollTop=pre.scrollHeight}
  const st=$('#jobstat'); if(st)st.innerHTML=r.job.status==='running'
    ?`<span class="spin"></span>${esc(r.job.label)} 运行中…`
    :`${r.job.status==='done'?'✓':'✗'} ${esc(r.job.label)} ${({done:'完成',failed:'失败',stopped:'已停止',interrupted:'已中断'})[r.job.status]||r.job.status}`;
  if(r.job.status==='running'){POLL=setTimeout(pollJob,900)}
  else{RUNNING=null;
    toast(`${r.job.label} ${r.job.status==='done'?'完成':'结束'}`,r.job.status==='done'?'':'err');
    if(R==='onboard'&&ST.obStep===2){
      if(r.job.status==='done'){ST.obFail=false;ST.obStep=3;await load(SLUG,true);return}
      ST.obFail=true;render();return}
    await load(SLUG,true)}
}

    <p class="muted" style="font-size:12.5px;margin-top:4px">全站指标都来自「问题库 × 引擎」的批量采样。规则是固定的、可复现的，下面是完整口径。</p>

    ${h('一、问题库怎么批量生成（接入品牌 / AI 补充选题）')}
    <ul style="font-size:12.5px;color:var(--t400);padding-left:18px">
      ${li('输入只有四样：<b>品牌名、品类、目标用户、一句话定义</b>——全部从官网正文自动抽取，抽不到的标「待确认」，不用常识填充。')}
      ${li('由你配置的 LLM 按固定提示词出题，分七组：<b>推荐、比较、替代、价格、风险、品牌验证、场景</b>，每组 2–4 题。')}
      ${li('题量按市场定：国内 18–24 题；海外 14–20 题；双市场 = 国内 16–20 + 海外 12–16 + 通用 2。编号 q001 起为国内、q101 起为海外、q901 起为通用。')}
      ${li('要求真实口语问法：国内题像真人在 AI 里打的字；海外题是<b>英文原生问法</b>，不是中文题翻译。')}
      ${li('<b>关键纪律：绝大多数问题不出现品牌名</b>——考的是 AI 会不会主动想到你。只有「品牌验证」组点名，这类题带「点名」标记，单独归品牌认知，不计入提及率。')}
      ${li('生成后自动去重、校验分组与市场标记；问题库随时可人工编辑，改完重跑采样才生效。')}
    </ul>

    ${h('二、采样怎么跑')}
    <ul style="font-size:12.5px;color:var(--t400);padding-left:18px">
      ${li('每期把问题库里的每道题逐个引擎各问一遍，存<b>原始回答全文</b>——引擎表现页的「样本回放」就是原文。')}
      ${li('市场路由：中文题只问国内引擎，英文题只问海外引擎，通用题两边都问；两套市场的指标分开算，分母各用各的。')}
      ${li('引擎分三类：联网 API（回答带真实引用来源）、不联网 API（测的是模型参数化知识里的品牌认知）、无公开 API（走人工采样表）。行内已标注。')}
      ${li('每条样本同时记录 API 耗时；引擎表现页显示中位耗时（抗超时长尾），让采样成本透明。')}
      ${li('<b>结果稳定性</b>：单条 AI 回答天然有随机性，所以指标从不看单条——看的是「几十道题 × 多引擎」的聚合比例；模型版本按引擎固定（设置里可查可改）；采样命令支持 <code>--repeat</code> 多轮加密样本；跨期对比遵守归因纪律——单期波动默认只作观察，连续两期同向变化才当趋势。')}
    </ul>

    ${h('三、指标口径（引擎表现页每一列）')}
    <ul style="font-size:12.5px;color:var(--t400);padding-left:18px">
      ${li('<b>提及率</b> = 无提示样本中，回答提到品牌（含别名）的比例。问题里点名了品牌的样本一律剔除——否则必然 100%，是假阳性。别名漏配会低估，到「设置 → 编辑当前品牌配置」补。')}

      ${li('<b>引用份额</b> = 回答引用的全部域名条数中，属于你自有域名（含子域名）的比例。不联网引擎通常没有引用，显示 —。')}

      ${li('<b>品牌提及分布 / 竞品最强引擎</b>：统计回答中出现的你与已配置竞品（别名并入），分母为对应范围的无提示样本数，同一样本提多次只算一次。<b>未配置的品牌不计入</b>——竞品清单和别名越全，分布越真实。')}
    </ul>

    <p class="muted" style="font-size:11.5px;margin-top:10px">规则实现在 scripts/bootstrap.py（出题）、sample.py（采样与判定）、analytics.py（指标），本弹窗与代码同步维护。</p>
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button class="btn btn-primary" onclick="closeModal()">知道了</button></div>`);

async function saveQuestions(){
  const cfg=await api('/api/config/'+SLUG);
  const qs=[];
  for(const line of $('#qedit').value.split('\n')){
    const m=line.split('|');if(m.length<4||!m[3].trim())continue;
    qs.push({id:m[0].trim(),group:m[1].trim()||'推荐',market:['cn','global','both'].indexOf(m[2].trim())>=0?m[2].trim():'cn',text:m.slice(3).join('|').trim()});
  }
  cfg.questions=qs; if(cfg.bootstrap)cfg.bootstrap.needs_review=false;
  const r=await post('/api/config/'+SLUG,cfg);
  toast(r.ok?`已保存 ${qs.length} 题`:'保存失败',r.ok?'':'err');
  if(r.ok){closeModal();load(SLUG,true)}
}

    truth:$('#f-truth').value.trim(),state:document.querySelector('input[name=fst]:checked').value});

    if(!confirm(`初稿风险检查有 ${D.lint.total} 项待人工核实（高风险 ${D.lint.high}）。确认已核实事实？`))return;
  let text=WB.text;
  if(text.indexOf(WB.q.id)<0)text=`<!-- 目标问题 ${WB.q.id} -->\n\n`+text;
  const r=await post('/api/content/'+SLUG,{path:`${WB.q.id}-成稿.md`,text});
  if(!r.ok){toast('发布失败：'+(r.error||''),'err');return}
  toast('已发布为成稿。重新生成蓝图后「内容承接」会更新');

}

async function doPublish(code){
  const rel='content/'+WB.cur.path;

  if(!confirm(`确认发布「${WB.cur.path}」到「${name}」？`))return;
  const r=await post('/api/publish/'+SLUG,{platform:code,path:rel});
  toast(r.ok?('已发布'+(r.url?'：'+r.url:(r.note?'，'+r.note:''))):('发布失败：'+(r.error||'')),r.ok?'':'err');
  PUB=null;if(r.ok)pubModal();

async function wbSave(){
  WB.text=$('#wbtext').value;

    ['llms.txt',site.has_llms_txt?'已上线':'缺失',!!site.has_llms_txt,'到部署资产查看 →'],
    ['页面可访问',(site.pages_ok||0)+' / '+(site.pages_crawled||0),(site.pages_ok||0)===(site.pages_crawled||0),'定位问题页 ↓'],
    ['语言覆盖','中文 '+(lc.zh_pages||0)+' 页 · 英文 '+(lc.en_pages||0)+' 页',(D.market!=='both')||((lc.en_pages||0)>0&&(lc.zh_pages||0)>0),'相关工单 →'],
  ];
  const gain={'数字事实':'+61.6%','定义':'+57.3%','对比':'+55.3%','操作步骤':'+41.2%','FAQ':'利于召回'};
  const gnote={A:'可直接被引用',B:'基本可用',C:'需要改造',D:'等于不存在'};
  const gmax=Math.max(1,...['A','B','C','D'].map(g=>gd[g]||0));
  // 联动筛选：点等级/抽取块 → 下方页面列表过滤（数据范围=服务端返回的分数最低 40 页）
  const gradeOf=s=>s>=80?'A':s>=65?'B':s>=45?'C':'D';
  const ag=ST.agrade||null,ab=ST.ablk||null;
  let plist=pages;
  if(ag)plist=plist.filter(p=>gradeOf(p.score)===ag);
  if(ab)plist=plist.filter(p=>!(p.blocks||{})[ab]);
  const blkTask=b=>(D.tasks||[]).find(t=>((t.acceptance||{}).check||'')==='pages.block:'+b);
  return `<div style="padding:32px 44px 72px;max-width:1280px">
    ${head('诊断 · 站点体检','内容层的问题在差距诊断，这里是技术层','能不能被抓到、结构好不好。六维口径：可抓取 / 长度 / 结构 / 抽取块 / 权威 / 对题，判据全部来自公开实证数据。')}
    <div class="kpis">
      ${flags.map(([l,v,ok,hint],i)=>`<div class="card elev" style="gap:4px;padding:15px;cursor:pointer" onclick="auditFlag(${i})" title="${esc(hint)}">
        <div style="font-size:11.5px;color:var(--t500)">${l}</div>
        <div style="font-size:15px;font-weight:500;color:${ok?'var(--text)':'var(--a300)'}">${esc(v)}</div>
        <div style="display:flex;justify-content:space-between;font-size:11px">
          <span style="color:${ok?'var(--t600)':'var(--accent)'}">${ok?'正常':'需处理'}</span>
          <span style="color:var(--a300)">${esc(hint)}</span></div></div>`).join('')}
    </div>
    ${(A.site_issues||[]).length?`<div class="card" style="margin-top:14px;box-shadow:0 0 0 1px var(--a700);padding:14px 16px;gap:5px">
      ${A.site_issues.map(i=>`<div style="font-size:13px;color:var(--t400)">· ${esc(i)}</div>`).join('')}</div>`:''}

    <div style="display:grid;grid-template-columns:1fr 1.2fr;gap:14px;margin-top:14px">
      <div class="card elev" style="padding:18px">
        <div style="font-size:15px;font-weight:500">页面等级分布 · 均分 ${A.avg_score??'—'}</div>
        <div style="font-size:11.5px;color:var(--t600);margin-bottom:10px">70 分以上算「基本可用」。</div>
        ${['A','B','C','D'].map(g=>`<div style="display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer;border-radius:6px;${ag===g?'background:var(--deep)':''}"
          title="点击筛选下方页面列表" onclick="ST.agrade=ST.agrade==='${g}'?null:'${g}';render()">
          <span style="width:110px;font-size:12.5px;flex:none;${ag===g?'color:var(--a300)':''}">${g} · ${gnote[g]}</span>
          <span class="bar" style="flex:1"><span style="width:${((gd[g]||0)/gmax*100).toFixed(0)}%"></span></span>
          <span style="width:30px;text-align:right;font-size:12px;color:var(--t400)">${gd[g]||0}</span></div>`).join('')}
        <div class="muted" style="font-size:11px;margin-top:6px">点击等级 → 下方列表只看该等级的页面</div>
      </div>
      <div class="card elev" style="padding:18px">
        <div style="font-size:15px;font-weight:500">全站抽取块缺口</div>
        <div style="font-size:11.5px;color:var(--t600);margin-bottom:8px">GEO 最大的单项杠杆，右列是实测的被引用概率增益。</div>
        <div class="tbl"><table class="table"><thead><tr><th>抽取块</th><th style="width:100px">缺失页数</th><th style="width:90px">实测增益</th><th style="width:110px">工单</th></tr></thead><tbody>
          ${(A.block_gap||[]).map(g=>{const t=blkTask(g.block);
            return `<tr style="cursor:pointer;${ab===g.block?'background:var(--deep)':''}" title="点击筛选下方缺这个块的页面"
              onclick="ST.ablk=ST.ablk===${esc(JSON.stringify(g.block))}?null:${esc(JSON.stringify(g.block))};render()">
            <td style="font-size:13.5px;${ab===g.block?'color:var(--a300)':''}">${esc(g.block)}</td>
            <td style="font-size:13px;color:var(--t400)">${g.missing_pages} / ${g.total}</td>
            <td style="font-size:13px;color:var(--a300)">${gain[g.block]||'—'}</td>
            <td>${t?`<span class="tag tag-outline" style="cursor:pointer;font-size:11px" title="打开工单详情"
              onclick="event.stopPropagation();taskModal(${esc(JSON.stringify(t.id))})">${esc(t.id)} →</span>`:'<span class="muted" style="font-size:11px">—</span>'}</td></tr>`}).join('')}
        </tbody></table></div>
        <div class="muted" style="font-size:11px;margin-top:6px">点击行 → 下方列表只看缺该块的页面；点工单号看怎么修。</div>
      </div>
    </div>

    <div class="row" id="audit-pages" style="margin:26px 0 8px">
      <h4 style="font-size:16px;margin:0">最需要改造的页面（分数从低到高）</h4>
      ${(ag||ab)?`<span class="tag tag-accent">${ag?('等级 '+ag):''}${ag&&ab?' + ':''}${ab?('缺「'+ab+'」'):''} · ${plist.length} 页</span>
        <button class="btn btn-ghost" style="font-size:11.5px" onclick="ST.agrade=null;ST.ablk=null;render()">清除筛选</button>`:''}
    </div>
    <div class="tbl"><table class="table"><thead><tr><th style="width:70px">分数</th><th style="width:70px">词数</th><th style="width:280px">缺失抽取块</th><th>页面</th></tr></thead><tbody>
      ${plist.slice(0,(ag||ab)?40:12).map(pg=>`<tr>
        <td style="font-size:13px;color:${pg.score<45?'var(--a300)':'var(--t400)'}">${pg.score}</td>
        <td style="font-size:13px;color:var(--t400)">${pg.word_count}</td>
        <td style="font-size:12.5px;color:var(--t500)">${esc(Object.keys(pg.blocks||{}).filter(k=>!pg.blocks[k]).join('、')||'—')}</td>
        <td style="font-size:12.5px"><a href="${esc(pg.url)}" target="_blank" rel="noopener">${esc((pg.title||pg.url).slice(0,60))}</a></td></tr>`).join('')}
    </tbody></table></div>
    <p class="muted" style="font-size:12px;margin-top:10px">词数接近 0 的是前端渲染空壳页——AI 抓取器看到的是空白，这是国内官网最常见的致命伤。修复清单见「行动计划」。</p>
  </div>`;
}

function auditFlag(i){
  // 站点体检顶部卡片的联动：robots/sitemap 直接看源文件，llms.txt 去部署资产，
  // 页面可访问定位到问题页列表，语言覆盖跳相关工单
  const site=(D.brand.site||'').replace(/\/$/,'');
  if(i===0&&site)window.open(site+'/robots.txt','_blank');
  else if(i===1&&site)window.open(site+'/sitemap.xml','_blank');
  else if(i===2)go('assets',{assetSel:'llms.txt'});
  else if(i===3){const el=document.querySelector('#audit-pages');if(el)el.scrollIntoView({block:'start'})}
  else if(i===4){
    const t=(D.tasks||[]).find(x=>/^site\.(en_pages_gte|lang_balance)/.test((x.acceptance||{}).check||''));
    if(t)taskModal(t.id);else go('plan');
  }
}

/* ===================== 部署资产 ===================== */
let AS={tree:null,cur:null,text:''};
const AS_DEST={
  '根目录':['① 上传到网站根目录','传上去后能通过 你的域名/llms.txt 直接访问；不要放进 /static/'],
  'jsonld':['② 贴进页面 <head>','不是上传 json 文件——把内容包进 <script type="application/ld+json"> 放进对应页面'],
  'snippets':['③ 贴进页面模板','定义块放首屏口号下方；FAQ 块的答案必须在静态 HTML 里可见'],
  'outlines':['④ 不上传 · 给内容团队','写作大纲——在「内容工作台」按骨架写'],
  'drafts':['⑤ 不上传 · 需先核实','AI 初稿，必须过风险检查并人工核实后才能发布'],
  'internal':['说明与索引 · 不上传','DEPLOY.md 是给开发的部署清单（含每步验收标准）'],
};
async function vAssets(){
  if(!AS.tree){const t=await api('/api/assets/'+SLUG);AS.tree=Array.isArray(t)?t:[]}
  if(ST.assetSel){const p=ST.assetSel;ST.assetSel=null; // 从站点体检等处跳来：直接打开指定文件
    if(AS.tree.some(a=>a.path===p))setTimeout(()=>asOpen(p),80)}
  const INT={'DEPLOY.md':1,'index.json':1,'_lint.json':1};
  const groups={};AS.tree.forEach(a=>{const fn=a.path.split('/').pop();
    (groups[INT[fn]?'internal':a.group]=groups[INT[fn]?'internal':a.group]||[]).push(a)});
  const order=['根目录','jsonld','snippets','internal','outlines','drafts'];
  return `<div style="padding:32px 44px 72px;max-width:1280px">
    ${head('提升 · 部署资产','系统生成的可部署产物','只有 llms.txt 是真的上传到网站根目录；JSON-LD 贴进 head，HTML 片段贴进模板，大纲和初稿不上网站。完整步骤与验收标准见 DEPLOY.md。')}
    ${D.lint&&D.lint.total?`<div class="card" style="margin:16px 0 0;box-shadow:0 0 0 1px var(--a700);padding:12px 16px">
      <div style="font-size:13px;color:var(--t400)">AI 初稿风险检查：<b>${D.lint.total}</b> 项待人工核实（高风险 ${D.lint.high}）。核实前不得发布——明细见 drafts/_lint.json。</div></div>`:''}
    <div style="display:grid;grid-template-columns:300px 1fr;gap:16px;margin-top:18px;align-items:start">
      <div class="card elev" style="padding:12px;max-height:560px;overflow:auto">
        ${AS.tree.length?order.filter(g=>groups[g]).map(g=>`
          <div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--t600);margin:10px 4px 4px;display:flex;justify-content:space-between">
            <span>${g==='根目录'?'llms.txt':g}</span><span style="color:var(--accent);text-transform:none;letter-spacing:0">${esc((AS_DEST[g]||[''])[0].replace(/^[①②③④⑤]\s*/,''))}</span></div>
          ${groups[g].map(a=>`<button class="navit ${AS.cur===a.path?'on':''}" style="font-size:12.5px" onclick="asOpen(${esc(JSON.stringify(a.path))})">
            <span class="mark"></span><span style="flex:1;text-align:left">${esc(a.path.split('/').pop())}</span>
            <span class="bdg">${(a.size/1024).toFixed(1)}k</span></button>`).join('')}`).join('')
          :'<div class="muted" style="font-size:12.5px;padding:8px">还没有资产——到「设置」跑「生成资产」</div>'}
      </div>
      <div id="asview" class="card elev" style="padding:16px;min-height:300px">
        ${AS.cur?'':'<div class="muted" style="font-size:13px">选一个文件查看。每个文件顶部会说明它的去处。</div>'}
      </div>
    </div>
  </div>`;
}
async function asOpen(path){
  AS.cur=path;
  const r=await api(`/api/asset/${SLUG}?path=${encodeURIComponent(path)}`);
  AS.text=r.text||'';
  await render();
  const grp=path.indexOf('/')>=0?path.split('/')[0]:'根目录';
  const fn=path.split('/').pop();
  const INT={'DEPLOY.md':1,'index.json':1,'_lint.json':1};
  const d=AS_DEST[INT[fn]?'internal':grp]||['',''];
  $('#asview').innerHTML=`
    <div class="card" style="padding:11px 14px;box-shadow:0 0 0 1px var(--a700);margin-bottom:12px;gap:3px">
      <div style="font-size:12.5px;font-weight:500">${esc(d[0])}</div>
      <div style="font-size:11.5px;color:var(--t500)">${esc(d[1])}</div></div>
    <div class="row" style="margin-bottom:8px"><b style="font-size:13px">${esc(path)}</b><span style="flex:1"></span>
      <button class="btn btn-ghost" style="font-size:12px" onclick="navigator.clipboard.writeText(AS.text);toast('已复制')">复制</button>
      <button class="btn btn-primary" style="font-size:12px" onclick="asSave()">保存修改</button></div>
    <textarea class="input" id="astext" rows="20" oninput="AS.text=this.value">${esc(AS.text)}</textarea>`;
}
async function asSave(){
  const r=await post('/api/asset/'+SLUG,{path:AS.cur,text:AS.text});
  toast(r.ok?'已保存':'失败：'+(r.error||''),r.ok?'':'err');
}

/* ===================== 框架 ===================== */
const VIEWS={overview:vOverview,engines:vEngines,competitors:vCompetitors,questions:vQuestions,
  siteaudit:vSiteAudit,assets:vAssets,
  gaps:vGaps,channels:vChannels,facts:vFacts,plan:vPlan,workbench:vWorkbench,
  verify:vVerify,report:vReport,settings:vSettings,onboard:vOnboard};
async function render(){
  renderSide();
  const fn=VIEWS[R]||vOverview;
  const out=fn();
  $('#view').innerHTML=(out instanceof Promise)?await out:out;
  if((R==='settings'||R==='onboard')&&RUNNING)pollJob();
}
function normAnalytics(a){
  a=(a&&!a.error)?a:{};
  const h=a.health=a.health||{};
  h.subs=h.subs||{};h.measured=h.measured||[];
  a.trend=a.trend||[];a.engines=a.engines||[];a.questions=a.questions||[];
  a.competitors=a.competitors||{};a.q_delta=a.q_delta||[];a.factcheck=a.factcheck||[];
  return a;
}
async function load(slug,keep){
  SLUG=slug;
  D=await api('/api/p/'+encodeURIComponent(slug));
  const aerr=D.error||(D.analytics&&D.analytics.error);
  D.brand=D.brand||{};D.tasks=D.tasks||[];
  D.analytics=normAnalytics(D.analytics);
  if(aerr){
    renderSide();
    $('#view').innerHTML=`<div style="padding:44px;max-width:560px">
      <h3 style="margin-bottom:10px">数据加载失败</h3>
      <p class="soft" style="font-size:13.5px">${esc(aerr)}</p>
      <div class="row" style="margin-top:14px">
        <button class="btn btn-primary" onclick="load(SLUG,true)">重试</button>
        <button class="btn btn-secondary" onclick="go('settings')">去设置</button></div>
    </div>`;
    return}
  const f=await api('/api/files/'+slug);D.samples_sheets=f.samples||[];D.deliveries=f.deliveries||[];D.reports=f.reports||[];
  const jr=await api('/api/jobs?slug='+slug);RUNNING=jr.running||null;
  AS.tree=null;   // 资产可能被任务更新过
  const hh=(location.hash||'').replace('#','');  // 支持 #路由 深链直达
  if(!keep)R=VIEWS[hh]?hh:((D.analytics&&D.analytics.latest_date)?'overview':'settings');
  history.replaceState({r:R,engSel:ST.engSel,gapTab:ST.gapTab},'','#'+R);
  render();
}
(async()=>{
  ACTIONS=await api('/api/actions');
  if(!ACTIONS||ACTIONS.error)ACTIONS={};
  const ps=await api('/api/projects');
  if(!Array.isArray(ps)){
    D={brand:{},analytics:normAnalytics(null),tasks:[]};
    renderSide();
    $('#view').innerHTML=`<div style="padding:44px;max-width:560px">
      <h3 style="margin-bottom:10px">无法连接服务</h3>
      <p class="soft" style="font-size:13.5px">${esc((ps&&ps.error)||'连接失败：服务未响应')}</p>
      <div class="row" style="margin-top:14px"><button class="btn btn-primary" onclick="location.reload()">重试</button></div>
    </div>`;
    return}
  if(!ps.length){R='onboard';ST.obStep=1;
    D={brand:{},analytics:normAnalytics(null),tasks:[]};
    render();return}
  load(ps[0].slug);
})();
</script>
</body>
